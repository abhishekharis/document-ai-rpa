name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install system libraries for OpenCV
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - run: pip install -r requirements.txt
      - run: pytest tests -q --cov=app --cov-report=term
        env:
          MONGODB_URI: mongodb://localhost:27017

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  accounting-and-rpa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Accounting app tests
        working-directory: simulated-accounting-app
        run: |
          pip install -r requirements-dev.txt
          pytest tests -q
      - name: RPA worker tests
        working-directory: rpa
        run: |
          pip install -r requirements-dev.txt
          pytest tests -q

  full-stack-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RPA_API_KEY: ci-smoke-test-key-0123456789
      RPA_DOCKER_POLL_INTERVAL: "3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pymupdf
      - name: Start the full stack
        run: docker compose -f docker-compose.full.yml up -d --build
      - name: Upload an invoice and follow it through OCR, RPA and the accounting app
        run: python scripts/smoke_full_stack.py http://localhost:8080
      - name: Accounting records survive a restart
        run: |
          docker compose -f docker-compose.full.yml restart accounting
          for i in $(seq 1 20); do
            count=$(curl -sf http://localhost:8080/accounting/api/records | python -c "import json,sys; print(json.load(sys.stdin)['count'])" || echo 0)
            [ "$count" -ge 1 ] && echo "records after restart: $count" && exit 0
            sleep 3
          done
          echo "records were lost after restart" && exit 1
      - name: Show container logs on failure
        if: failure()
        run: docker compose -f docker-compose.full.yml logs --tail=100
      - name: Stop the stack
        if: always()
        run: docker compose -f docker-compose.full.yml down -v
