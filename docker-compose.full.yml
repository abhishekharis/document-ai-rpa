# Full stack: docker compose -f docker-compose.full.yml up --build
# Requires RPA_API_KEY in the environment or a root .env file.
name: document-ai-rpa-full

services:
  mongodb:
    image: mongo:7.0
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      MONGODB_URI: mongodb://mongodb:27017
      RPA_API_KEY: ${RPA_API_KEY:?set RPA_API_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:8080"]}
    volumes:
      - storage_data:/data/storage
      - ocr_models:/root/.paddlex
    depends_on:
      mongodb:
        condition: service_healthy

  accounting:
    build: simulated-accounting-app
    environment:
      SECRET_KEY: ${ACCOUNTING_SECRET_KEY:-demo-accounting-secret}
    volumes:
      - accounting_data:/data

  rpa:
    build:
      context: .
      dockerfile: rpa/Dockerfile
    environment:
      API_BASE_URL: http://backend:8000
      ACCOUNTING_APP_URL: http://accounting:3001
      RPA_API_KEY: ${RPA_API_KEY:?set RPA_API_KEY}
      RPA_POLL_INTERVAL: ${RPA_DOCKER_POLL_INTERVAL:-5}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      accounting:
        condition: service_healthy

  frontend:
    build: frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
      - accounting

volumes:
  mongodb_data:
  storage_data:
  accounting_data:
  ocr_models:
