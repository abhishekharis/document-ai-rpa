server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 12m;

    location /api/ {
        proxy_pass http://backend:8000;
        # Upload runs OCR synchronously; the first run also downloads the models
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /accounting {
        return 301 /accounting/;
    }

    location /accounting/ {
        proxy_pass http://accounting:3001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Prefix /accounting;
    }

    location / {
        try_files $uri /index.html;
    }
}
